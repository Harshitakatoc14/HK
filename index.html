<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Valentine Surprise</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    overflow-x: hidden;
    height: 100%;
}

/* GENERAL PAGE STYLE */
.page {
    width: 100vw;
    height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
    padding: 20px;
}

.active {
    display: flex;
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* PAGE 1 */
.page1 {
    background: linear-gradient(to bottom, #ff758c, #ff7eb3);
    overflow: hidden;
}

.page1 img {
    max-width: 80%;
    max-height: 70%;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    animation: photoPop 1.5s ease;
    z-index: 2;
}

@keyframes photoPop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.center-button {
    margin-top: 25px;
    background-color: white;
    padding: 15px 25px;
    border-radius: 50px;
    font-size: 22px;
    color: #ff4d6d;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
    animation: bounce 2s infinite;
    z-index: 2;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* HEART ANIMATION FOR PAGE 1 */
.heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
}

@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* CARD STYLE */
.card {
    background-color: white;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    width: 90%;
    max-width: 600px;
    border: 5px solid pink;
}

/* PAGE 2 */
.page2 {
    background-color: #ffe6f0;
}

/* PAGE 3 */
.page3 {
    background: linear-gradient(to bottom, #ffb6c1, #ff69b4);
    overflow: hidden;
}

/* KISS ANIMATION FOR PAGE 3 */
.kiss {
    position: absolute;
    font-size: 28px;
    animation: floatKiss 5s linear infinite;
}

@keyframes floatKiss {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

.options button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    font-size: 18px;
    cursor: pointer;
    background-color: #ff4d6d;
    color: white;
}

.special-message {
    font-size: 22px;
    color: darkred;
    margin-top: 20px;
    line-height: 1.6;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page page1 active" id="page1">
    <img src="us.jpg" alt="Us Together">
    <div class="center-button" id="startBtn">Love is in the Air ❤️</div>
</div>

<!-- PAGE 2 -->
<div class="page page2" id="page2">
    <div class="card">
        <div class="question" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div id="message"></div>
    </div>
</div>

<!-- PAGE 3 -->
<div class="page page3" id="page3">
    <div class="card">
        <div class="question">Will you be my Valentine, Vansh? 💘</div>

        <div class="options">
            <button onclick="checkValentine('yes')">Yes ❤️</button>
            <button id="noBtn">No 😢</button>
        </div>

        <div class="special-message" id="specialMessage"></div>
    </div>
</div>

<script>

// PAGE NAVIGATION
const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');
const page3 = document.getElementById('page3');

document.getElementById('startBtn').onclick = () => {
    page1.classList.remove('active');
    page2.classList.add('active');
    showQuestion(0);
};

// HEART ANIMATION FOR FIRST PAGE
function createHeartsPage1() {
    const emojis = ['💖','❤️','💕','💗','💓'];

    for(let i=0;i<20;i++){
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        heart.style.left = Math.random()*100 + 'vw';
        heart.style.animationDuration = (4 + Math.random()*4) + 's';
        page1.appendChild(heart);
    }
}

createHeartsPage1();

// QUIZ QUESTIONS
const questions = [
    { text: "When did we kiss for the first time?", options: ["25 December", "26 December", "27 December"], answer: "26 December" },
    { text: "When did you say I love you to me?", options: ["1 January", "2 January", "3 January"], answer: "2 January" },
    { text: "Whom do you love the most?", options: ["PUBG", "Me"], answer: "Me" },
    { text: "Who is the smartest person in our relationship?", options: ["Vansh", "Harshita"], answer: "Harshita" }
];

let currentQuestion = 0;

function showQuestion(index) {
    document.getElementById("message").textContent = "";
    questionText.textContent = questions[index].text;
    optionsContainer.innerHTML = "";

    questions[index].options.forEach(option => {
        const btn = document.createElement('button');
        btn.textContent = option;
        btn.onclick = () => checkAnswer(option);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(selected) {
    const msg = document.getElementById("message");

    if (selected === questions[currentQuestion].answer) {

        msg.style.color = "green";
        msg.textContent = "Correct answer Mote! 😘";

        setTimeout(() => {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion(currentQuestion);
            } else {
                page2.classList.remove('active');
                page3.classList.add('active');
                startKissesPage3();
            }
        }, 1200);

    } else {
        msg.style.color = "red";
        msg.textContent = "Wrong answer, try again Mote 😜";
    }
}

// KISS ANIMATION FOR PAGE 3
function startKissesPage3() {
    for(let i=0;i<25;i++){
        const kiss = document.createElement('div');
        kiss.classList.add('kiss');
        kiss.textContent = "💋";
        kiss.style.left = Math.random()*100 + 'vw';
        kiss.style.animationDuration = (3 + Math.random()*3) + 's';
        page3.appendChild(kiss);
    }
}

// FINAL VALENTINE MESSAGE
function checkValentine(ans) {
    const msg = document.getElementById("specialMessage");

    if(ans === 'yes') {
        msg.innerHTML = `
        Thank you for being my sunshine 🌞<br>
        I love you Motee 💖<br>
        Lots of love and kisses on the way 💋
        `;
    }
}

// FUNNY NO BUTTON MOVEMENT
noBtn.onmouseover = () => {
    noBtn.style.position = "absolute";
    noBtn.style.left = Math.random()*80 + "%";
    noBtn.style.top = Math.random()*80 + "%";
};

</script>

</body>
</html>
